name: OCR Availability Probe

# P1 (2026-06-14). The paid OCR availability check that USED to run on every
# production deploy (burning Vision quota + failing on transient rate-limits).
# The project is currently paused, so automatic paid-provider probes are disabled.
# Keep workflow_dispatch for an explicit pre-resume or incident check only.
#
# Goal: detect a SUSTAINED OCR outage (provider hard-down / billing disabled /
# credentials broken), NOT a momentary rate-limit. Because vision-extract now
# degrades HONESTLY (typed error + non-2xx), this probe treats a typed transient
# error (429 OCR_RATE_LIMITED / 503 OCR_PROVIDER_UNAVAILABLE) as EXPECTED and
# does NOT page — only a successful read OR a TERMINAL typed error
# (OCR_BILLING_DISABLED / OCR_QUOTA_EXHAUSTED) OR a non-typed 5xx/404/timeout is
# actionable. HTTP 200 review outcomes (no fields / needs a better scan / reshoot)
# prove endpoint availability and do not page. No PII (committed synthetic
# passport). No auto re-run loop — one endpoint request, one verdict. The reader
# may make multiple provider attempts within that endpoint request.
on:
  # Intentionally manual-only while Message Info is paused.
  # Re-enable a schedule only together with an explicit production-active decision.
  workflow_dispatch:

concurrency:
  group: ocr-availability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify probe response contract
        run: python3 scripts/monitoring/test_classify_ocr_probe.py
      - name: One minimal vision-extract probe (synthetic, no PII)
        run: |
          # Exactly one endpoint request per run. The committed synthetic passport
          # carries zero real PII. The reader may make multiple provider attempts.
          code=$(curl -s -o /tmp/p.json -w "%{http_code}" --max-time 150 -X POST \
            https://messenginfo.com/api/translation/vision-extract \
            -F "file=@test-fixtures/synthetic-passport.jpg;type=image/jpeg")
          echo "vision-extract probe HTTP=$code"
          head -c 300 /tmp/p.json; echo
          python3 scripts/monitoring/classify_ocr_probe.py "$code" /tmp/p.json
