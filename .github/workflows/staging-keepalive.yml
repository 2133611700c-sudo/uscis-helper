name: Staging Keep-Alive (Free-tier idle guard)

# Supabase Free auto-pauses a project after ~7 days with zero DB/API activity.
# The isolated staging project (ADR-023) is on a separate Free account and stays
# idle between V1 release pushes, so Supabase paused-pending warnings fire whenever
# no PR touches staging for a week.
#
# This workflow makes the cheapest possible activity Supabase counts as usage:
# a single request to the staging Auth health endpoint through the API gateway.
# No DB password needed — uses the publishable (anon) key, which is non-sensitive
# by design (it ships in client bundles). Read-only, no DDL, no data writes.
#
# Required secrets:
#   STAGING_SUPABASE_PROJECT_REF   — must equal rxnlpvldngxgdxkxoaaj (staging), != prod
#   STAGING_SUPABASE_ANON_KEY      — publishable/anon key (non-sensitive)
#
# Hard guard: refuses to run if the target ref equals the production ref.

on:
  workflow_dispatch:        # manual test button
  schedule:
    - cron: '0 9 */3 * *'   # every 3 days at 09:00 UTC

permissions:
  contents: read

env:
  PROD_REF: rtfxrlountkoegsseukx
  STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

jobs:
  keepalive:
    name: Ping staging auth health (idle-guard)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Guard — staging ref present and != production
        run: |
          if [ -z "$STAGING_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF secret missing — refusing to run."
            exit 1
          fi
          if [ "$STAGING_REF" = "$PROD_REF" ]; then
            echo "::error::GUARD FAIL: staging ref equals production ref — refusing to run."
            exit 1
          fi
          echo "guard_ok: target=$STAGING_REF (not prod)"

      - name: Ping auth health endpoint (counts as project activity)
        env:
          ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANON_KEY:-}" ]; then
            echo "::error::STAGING_SUPABASE_ANON_KEY secret missing — refusing to run."
            exit 1
          fi
          URL="https://${STAGING_REF}.supabase.co/auth/v1/health"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: ${ANON_KEY}")
          if [ "$CODE" != "200" ]; then
            echo "::error::keepalive ping did not return 200 (got: $CODE)"
            exit 1
          fi
          echo "keepalive_ok: staging auth health 200 at $(date -u +%FT%TZ)"
