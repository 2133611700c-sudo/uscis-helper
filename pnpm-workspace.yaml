packages:
  - "apps/*"
  - "packages/*"

# BUILD ALLOWLIST — authoritative location for pnpm 11+.
# pnpm 11 replaced package.json.pnpm.onlyBuiltDependencies with allowBuilds in
# pnpm-workspace.yaml. This repo runs under pnpm 11.7.0 in the current workspace.
# Never run `pnpm approve-builds` (interrupted prompt writes junk into this file).
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
